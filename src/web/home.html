<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TvBox MediaOS home</title>
<link rel="stylesheet" href="/static/overlay.css">
<link rel="stylesheet" href="/static/home.css">
</head>
<body class="home">
<header>
  <span id="brand">TvBox MediaOS</span>
  <span id="clock"></span>
</header>
<main id="tiles-view">
  <div id="tiles"></div>
  <p id="problem" hidden></p>
</main>
<main id="settings-view" hidden>
  <nav id="panel">
    <h1 id="title"></h1>
    <ul id="items"></ul>
    <input id="text-input" type="password" autocomplete="off" hidden>
    <p id="note" hidden></p>
    <dl id="about" hidden></dl>
  </nav>
  <aside id="pair" hidden>
    <img id="pair-qr" alt="">
    <p>Scan with the phone's camera, or open</p>
    <p id="pair-url"></p>
    <p id="pair-ip"></p>
    <p id="pair-expiry"></p>
  </aside>
</main>
<script src="/static/common.js"></script>
<script src="/static/home.js"></script>
</body>
</html>
