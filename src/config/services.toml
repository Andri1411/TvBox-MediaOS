# tvbox services: the tiles on the home screen.
#
# Do not edit this file (updates replace it). Put changes in
#   /etc/tvbox/services.toml  or  ~/.config/tvbox/services.toml
# A [[service]] there with an existing id changes only the keys it lists;
# a new id adds a tile. `enabled = false` removes one. `order = [...]` at the
# top sets the tile order (services not listed follow in file order).
#
# kind = "browser": its own Chromium instance and profile (logins persist)
#   url         start page
#   user_agent  a name from [user_agents], or a full user-agent string
#   nav         true: add d-pad navigation and automatic on-screen keyboard to
#               a desktop site (the tvnav extension; site rules in its sites/)
#   flags       extra Chromium command line flags (list)
# kind = "native": any program
#   exec        command line (list)
# Both: name, color (tile colour), pause (pause playback when switching away,
# default true for browsers).

order = ["youtube", "netflix", "disney", "floatplane", "jellyfin"]

[user_agents]
# A smart-TV browser: makes youtube.com/tv serve the TV interface.
tv = "Mozilla/5.0 (Web0S; Linux/SmartTV) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/108.0.5359.211 Safari/537.36 WebAppManager"

[[service]]
id = "youtube"
name = "YouTube"
kind = "browser"
url = "https://www.youtube.com/tv"
user_agent = "tv"
color = "#e62117"

[[service]]
id = "netflix"
name = "Netflix"
kind = "browser"
url = "https://www.netflix.com/browse"
nav = true
color = "#b1060f"

[[service]]
id = "disney"
name = "Disney+"
kind = "browser"
url = "https://www.disneyplus.com/home"
nav = true
color = "#0e3a8c"

[[service]]
id = "floatplane"
name = "Floatplane"
kind = "browser"
url = "https://www.floatplane.com/tv"      # TV interface; needs no TV user agent
color = "#0085ff"

[[service]]
id = "jellyfin"
name = "Jellyfin"
kind = "native"
exec = ["jellyfin-desktop", "--tv", "--fullscreen"]
color = "#7b4fc4"
