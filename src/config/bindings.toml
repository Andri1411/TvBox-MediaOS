# tvbox default bindings: logical button -> action.
#
# Do not edit this file (updates replace it). Put changes in
#   /etc/tvbox/bindings.toml            (whole box)
#   ~/.config/tvbox/bindings.toml       (tv user, wins)
# Only the buttons you list there change; everything else keeps its default.
# Files are reloaded when saved. A file with mistakes is rejected as a whole
# and the previous bindings stay active (see `tvbox-ctl status`).
#
# Buttons
#   every device:  up down left right ok back home menu
#                  play_pause vol_up vol_down mute next prev ff rew
#   gamepad:       x y lb rb lt rt view start ls rs   (A = ok, B = back, Xbox = home)
#                  ls_up ls_down ls_left ls_right     (left stick; unbound = same as d-pad)
#                  rs_up rs_down rs_left rs_right     (right stick)
#
# Actions
#   "key:<combo>"        tap a key: key:Return, key:ctrl+l, key:XF86AudioPlay, key:KEY_F13
#   "ui:home" "ui:system_menu" "ui:keyboard" "ui:app_switcher" "ui:back"
#   "volume:+2" "volume:-2" "volume:mute"
#   "audio:next_output"  "mouse:toggle"  "app:restart"  "app:launch:<id>"
#   "none"               unbind
#
# A binding is an action (fires when the button goes down) or a table:
#   { press = "...", long = "..." }      short press fires on release, long while held
#   { press = "...", repeat = true }     fires again while held

[timing]
long_press_ms = 500
repeat_delay_ms = 350
repeat_hz = 12

# Mouse mode: left stick = pointer, right stick = scroll, A = click,
# X = right click.
[mouse]
speed = 900            # pointer speed in px/s at full tilt (doubles while held)
scroll_speed = 18      # wheel notches per second at full tilt

[global]
up    = { press = "key:Up", repeat = true }
down  = { press = "key:Down", repeat = true }
left  = { press = "key:Left", repeat = true }
right = { press = "key:Right", repeat = true }
ok    = "key:Return"
back  = "key:Escape"
# The button that opens the system menu cannot be rebound per app.
home  = { press = "ui:home", long = "ui:system_menu" }
menu  = "ui:system_menu"

start      = "key:space"            # play/pause
play_pause = "key:XF86AudioPlay"
lb   = { press = "key:Left", repeat = true }    # seek back
rb   = { press = "key:Right", repeat = true }   # seek forward
rew  = "key:XF86AudioRewind"
ff   = "key:XF86AudioForward"
prev = "key:XF86AudioPrev"
next = "key:XF86AudioNext"

lt       = { press = "volume:-2", repeat = true }
rt       = { press = "volume:+2", repeat = true }
vol_down = { press = "volume:-2", repeat = true }
vol_up   = { press = "volume:+2", repeat = true }
mute     = "volume:mute"

y    = "ui:keyboard"
view = "ui:app_switcher"

# Per-app bindings: [app.<id>], ids as in services.toml.
# Desktop sites: B is the browser's Back.
[app.netflix]
back = "key:alt+Left"

[app.disney]
back = "key:alt+Left"

# Devices are recognised automatically (gamepads; remotes = arrow keys + OK
# without a full keyboard). A real keyboard is left alone. To treat a
# keyboard-like device as a remote:
# [[device]]
# name = "My BLE Remote*"      # glob on the device name, and/or id = "vid:pid"
# profile = "remote"           # gamepad | remote | ignore
# grab = true                  # hide the device's own key presses from apps
# map = { KEY_F1 = "menu" }    # extra keys -> buttons
