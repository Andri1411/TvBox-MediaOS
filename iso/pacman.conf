# Used by mkarchiso to build the live system. @LOCAL_REPO_DIR@ is replaced by
# scripts/build-iso.sh with the freshly built repo.
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Our own freshly built packages, straight from build/repo: nothing to verify
# here, and the builder doesn't have the signing key (with signed builds in CI,
# "Optional" still fails on the unknown key). The copy embedded in the ISO stays
# signed and the installer verifies it.
[@REPO_NAME@]
SigLevel = Never
Server = file://@LOCAL_REPO_DIR@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
