# Bare laptop mainboard: the lid sensor may be missing or floating, and the box
# must never sleep. A short power-button press is ignored; long press still
# forces power off in firmware.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandlePowerKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
IdleAction=ignore
